version: "3.8"

services:
  php-apache-backend:
    build: .
    container_name: php-apache-backend
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./css:/var/www/html/css
      - ./js:/var/www/html/js
      - ./src:/var/www/html/src
      - ./php/apache-config.conf:/etc/apache2/conf-enabled/apache-config.conf
      - ./vendor:/var/www/html/vendor
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      TZ: Asia/Bangkok

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql_data:
