<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสิทธิ์ผู้ใช้</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/user-roles.css">
</head>

<body>
    <iframe src="sidebar.html?page=profile" class="sidebar-frame"></iframe>
    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-user-shield"></i> จัดการสิทธิ์ผู้ใช้</h1>
            <p>กำหนด Role ให้กับผู้ใช้แต่ละคนในระบบ</p>
        </div>

        <div class="container">
            <!-- Left: User List -->
            <div class="panel">
                <div class="panel-title">
                    <i class="fas fa-users"></i> รายชื่อผู้ใช้
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อ...">
                </div>
                <div class="user-list" id="userList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>
                </div>
            </div>

            <!-- Right: Role Assignment -->
            <div class="panel right-panel">
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-hand-pointer"></i>
                    <p>เลือกผู้ใช้เพื่อจัดการสิทธิ์</p>
                </div>

                <div id="rolePanel" class="role-panel">
                    <div class="selected-user-header">
                        <div class="selected-avatar" id="selectedAvatar"></div>
                        <div class="selected-user-info">
                            <h2 id="selectedName"></h2>
                            <p id="selectedEmail"></p>
                        </div>
                    </div>

                    <div class="role-section-title">เลือก Role ที่ต้องการ</div>
                    <div class="roles-grid" id="rolesGrid"></div>

                    <div class="action-row">
                        <button class="btn btn-cancel" onclick="cancelSelect()">ยกเลิก</button>
                        <button class="btn btn-save" onclick="saveRole()">
                            <i class="fas fa-save"></i> บันทึก
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/user-roles.js"></script>
</body>

</html>
