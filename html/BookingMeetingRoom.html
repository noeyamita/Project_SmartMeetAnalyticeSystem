<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องประชุม</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/BookingMeetingRoom.css">

</head>

<body>
    <iframe src="sidebar.html?page=booking" class="sidebar-frame"></iframe>

    <main class="main-content">
        <div class="container">
            <header>
                <h1>จองห้องประชุม</h1>
                <p class="muted">เลือกช่วงเวลาและจำนวนผู้เข้าร่วมเพื่อค้นหาห้องว่าง</p>
            </header>

            <div id="alertBox" class="alert"></div>

            <section class="search-panel card">
                <div class="row">
                    <label>วันที่
                        <input type="date" id="date" required>
                    </label>
                    <label>เวลาเริ่มต้น
                        <input type="time" id="start_time" required>
                    </label>
                    <label>เวลาสิ้นสุด
                        <input type="time" id="end_time" required>
                    </label>
                    <label>จำนวนผู้เข้าร่วม
                        <input type="number" id="capacity" min="1" value="1" required>
                    </label>
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="searchRooms()">ค้นหาห้องว่าง</button>
                    <button class="btn" onclick="resetSearch()">ล้างค่า</button>
                </div>
            </section>

            <section class="card">
                <h2>ผลลัพธ์ห้องประชุม</h2>
                <div class="rooms-grid" id="roomsGrid">
                    <div class="empty-state">
                        <div style="font-size: 64px; opacity: 0.3; ">📅</div>
                        <p>กรุณาเลือกวันที่และเวลาเพื่อค้นหาห้องว่าง</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ยืนยันการจองห้องประชุม</h3>
                <p class="muted" id="modalRoomInfo"></p>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>หัวข้อการประชุม
                        <input type="text" id="meeting_title" placeholder="ระบุหัวข้อการประชุม" required>
                    </label>
                </div>
                <div class="form-group">
                    <label>จำนวนผู้เข้าร่วม (คน)
                        <input type="number" id="modal_attendees" min="1" value="1" required>
                    </label>
                </div>
                <div class="form-group">
                    <label>รูปแบบการจัดโต๊ะ</label>
                    <div id="tableLayoutOptions" class="equipment-list">
                    </div>
                </div>

                <div class="form-group">
                    <label>อุปกรณ์ที่ต้องการใช้</label>
                    <div id="equipmentOptions" class="equipment-list">
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">ยกเลิก</button>
                <button class="btn primary" onclick="confirmBooking()">ยืนยันการจอง</button>
            </div>
        </div>
    </div>
    <div id="altRoomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #667eea;">ค้นหาห้องทดแทนให้การจองที่ถูกย้าย</h3>
                <p class="muted">กรุณาเลือก 1 ใน 5 ห้องว่างด้านล่าง ที่รองรับจำนวนคนและอุปกรณ์ได้</p>
            </div>
            <div class="modal-body" id="altRoomList">
                <div class="loading">กำลังค้นหาห้องว่างที่เหมาะสม...</div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="skipMoveRoom()">ข้าม (ปล่อยให้ถูกยกเลิกไป)</button>
                <button class="btn primary" id="confirmMoveBtn" onclick="confirmMoveRoom()"
                    disabled>ยืนยันการย้ายไปห้องนี้</button>
            </div>
        </div>
    </div>


    <script>
        window.USER_ROLE = "admin";
    </script>
    <script src="js/BookingMeetingRoom.js"></script>
</body>

</html>
