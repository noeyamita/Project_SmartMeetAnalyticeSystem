<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการห้องประชุม - Room Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/room-management.css">
</head>
<body>
    <iframe src="sidebar.html?page=booking" class="sidebar-frame"></iframe>
    <main class="main-content">
        <div class="container">
            <header>
                <h1><i class="fa-solid fa-screwdriver-wrench"></i> ระบบจัดการห้องประชุม</h1>
                <p class="subtitle">Meeting Room Management System</p>
            </header>

            <div class="content">
                <section class="form-section">
                    <h2 id="formTitle">เพิ่มห้องประชุมใหม่</h2>
                    <form id="roomForm">
                        <input type="hidden" id="roomId">
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="roomName">ชื่อห้อง *</label>
                                <input type="text" id="roomName" required>
                            </div>

                            <div class="form-group">
                                <label for="capacity">ความจุคน *</label>
                                <input type="number" id="capacity" min="1" required>
                            </div>

                            <div class="form-group">
                                <label for="roomSize">ขนาดห้อง (ตร.ม.) *</label>
                                <input type="number" id="roomSize" step="0.01" min="0" required>
                            </div>

                            <div class="form-group">
                                <label for="floorNumber">ชั้น,ห้อง *</label>
                                <input type="text" id="floorNumber" required>
                            </div>

                            <div class="form-group">
                                <label for="status">สถานะ *</label>
                                <select id="status" required>
                                    <option value="">กำลังโหลด...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="air_conditioner">มีแอร์หรือไม่ *</label>
                                <select id="air_conditioner" required>
                                    <option value="">กำลังโหลด...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="openTime">เวลาเปิด *</label>
                                <input type="time" id="openTime" required>
                            </div>

                            <div class="form-group">
                                <label for="closeTime">เวลาปิด *</label>
                                <input type="time" id="closeTime" required>
                            </div>

                            <div class="form-group">
                                <label for="imageFile">รูปภาพห้องประชุม</label>
                                <input type="file" id="imageFile" accept="image/*">
                                <small class="file-info">รองรับไฟล์: JPG, PNG, GIF (ไม่เกิน 2MB)</small>
                                <div id="imagePreview" class="image-preview"></div>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="description">รายละเอียด</label>
                            <textarea id="description" rows="3"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="fa-solid fa-floppy-disk"></i> บันทึก
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn">
                                <i class="fa-solid fa-xmark"></i> ยกเลิก
                            </button>
                        </div>
                    </form>
                </section>

                <section class="table-section">
                    <div class="table-header">
                        <h2>รายการห้องประชุม</h2>
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                            <input type="text" id="searchInput" placeholder="ค้นหาห้อง...">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table id="roomTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>รูปภาพ</th>
                                    <th>ชื่อห้อง</th>
                                    <th>ความจุคน</th>
                                    <th>ขนาด (ตร.ม.)</th>
                                    <th>ชั้น,ห้อง</th>
                                    <th>สถานะ</th>
                                    <th>มีแอร์หรือไม่</th>
                                    <th>เวลาเปิด-ปิด</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="roomTableBody">
                                <tr>
                                    <td colspan="9" class="text-center">
                                        <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลดข้อมูล...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="altRoomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;"></i> จัดหาห้องทดแทน (ห้องถูกปิด)</h3>
            </div>
            <div class="modal-body" id="altRoomList">
                <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> กำลังค้นหาข้อมูล...</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="skipMoveRoom()">
                    <i class="fa-solid fa-forward-step"></i> ข้าม (ปล่อยสถานะให้รอการย้าย)
                </button>
                <button class="btn btn-primary" id="confirmMoveBtn" onclick="confirmMoveRoom()" disabled>
                    <i class="fa-solid fa-check"></i> ยืนยันการย้ายไปห้องนี้
                </button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/room-management.js"></script>
</body>
</html>
