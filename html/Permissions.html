<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสิทธิ์</title>
    <link rel="stylesheet" href="css/Permissions.css">
</head>

<body>
    <iframe src="sidebar.html?page=booking" class="sidebar-frame"></iframe>
    <div class="container">
        <h2>ระบบจัดการสิทธิ์</h2>

        <div class="content-wrapper">
            <!-- Left Panel: Positions -->
            <div class="positions-panel">
                <div class="panel-title">ตำแหน่ง (Position)</div>
                <input type="text" class="position-search" placeholder="ค้นหา ตำแหน่ง เช่น Admin">

                <div id="positionsList">
                    <!-- Roles will be loaded from database -->
                    <p style="text-align:center; padding:20px; color:#999;">กำลังโหลดข้อมูล...</p>
                </div>
            </div>

            <!-- Right Panel: Permissions -->
            <div class="permissions-panel">
                <div class="tabs">
                    <div class="tab active">การจัดการเมนู</div>
                    <div class="tab role-tab">ลบ Role</div>
                </div>

                <div class="permissions-title" id="permissionTitle">Permission for: (กรุณาเลือก Role)</div>
                <div class="permissions-subtitle">ติ๊กเพื่อมอบ/ยกเลิกสิทธิ์</div>

                <div class="menu-grid" id="menuGrid">
                    <!-- Permissions will be loaded from database -->
                    <p style="text-align:center; padding:20px; color:#999;">กำลังโหลดข้อมูล...</p>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-save" onclick="savePermissions()">บันทึก</button>
                    <button class="btn btn-cancel" onclick="resetPermissions()">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/Permissions.js"></script>
</body>

</html>
