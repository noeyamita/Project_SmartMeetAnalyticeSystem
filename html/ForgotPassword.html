<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartMeet Analytice System</title>
    <link rel="stylesheet" href="../css/login_out_forgot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">

        <div class="left-panel">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1>SmartMeet<br>Analytice System</h1>
                <p>Forgot your password? <p>Don't worry, we'll help you.</p></p>
            </div>
        </div>

        <div class="right-panel">
            <form class="login-box" id="forgotPasswordForm">
                <h2>Forgot Password</h2>
                <p class="forgot-description">Enter your email address and we'll send you a link to reset your password.
                </p>
                <div id="alertBox" class="alert"></div>

                <div class="input-box">
                    <input type="email" id="email" placeholder="Enter your e-mail address" required>
                </div>

                <button type="submit" class="btn">Send Reset Link</button>

                <div class="back-to-login">
                    <p>Remember your password? <a href="login.html">Back to Login</a></p>
                </div>

                <div class="success-message" id="successMessage" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script src="../js/ForgotPassword.js"></script>
</body>

</html>
