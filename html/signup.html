<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - SmartMeet Analytice System</title>
    <link rel="stylesheet" href="css/login_out_forgot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">

        <div class="left-panel">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1>SmartMeet<br>Analytice System</h1>
            </div>
        </div>

        <div class="right-panel">
            <form class="login-box" id="signupForm">
                <h2>Sign up</h2>
                <p class="register">Already have an account? <a href="login.html">Sign in here.</a></p>

                <div class="input-box">
                    <input type="email" name="email" placeholder="E-mail Address" required>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="input-box" style="flex: 1;">
                        <input type="text" name="fname" placeholder="First name" required>
                    </div>
                    <div class="input-box" style="flex: 1;">
                        <input type="text" name="lname" placeholder="Last name" required>
                    </div>
                </div>

                <div class="input-box">
                    <input type="tel" name="phone" placeholder="Phone Number">
                </div>

                <div class="password-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <img src="eye-close.png" id="togglePassword" alt="Toggle Password">
                    <span id="strengthMessage"></span>
                </div>

                <div class="password-box" style="margin-top: 30px;">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
                        required>
                    <img src="eye-close.png" id="toggleConfirmPassword" alt="Toggle Password">
                </div>

                <button type="submit" class="btn">Sign up</button>
                <p id="signupMessage" style="margin-top: 10px; text-align: center; font-size: 14px; font-weight: 500;">
                </p>
            </form>
        </div>
    </div>

    <script>
        function setupPasswordToggle(inputId, toggleId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(toggleId);

            if (passwordInput && toggleIcon) {
                toggleIcon.addEventListener('click', function () {
                    if (passwordInput.type === "password") {
                        passwordInput.type = "text";
                        toggleIcon.src = "eye-open.png";
                    } else {
                        passwordInput.type = "password";
                        toggleIcon.src = "eye-close.png";
                    }
                });
            }
        }

        const passwordInput = document.getElementById('password');
        const strengthMessage = document.getElementById('strengthMessage');

        if (passwordInput && strengthMessage) {
            passwordInput.addEventListener('input', function () {
                const val = passwordInput.value;

                if (val.length === 0) {
                    strengthMessage.textContent = "";
                    return;
                }

                let strength = "Weak";
                let color = "#ef4444";

                if (val.length > 6 && /[0-9]/.test(val) && /[A-Z]/.test(val)) {
                    strength = "Strong";
                    color = "#22c55e";
                } else if (val.length > 4) {
                    strength = "Medium";
                    color = "#f59e0b";
                }

                strengthMessage.textContent = "Password strength: " + strength;
                strengthMessage.style.color = color;
            });
        }

        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageEl = document.getElementById('signupMessage');

            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');

            if (password !== confirmPassword) {
                messageEl.style.color = '#dc2626';
                messageEl.textContent = 'รหัสผ่านไม่ตรงกัน';
                return;
            }

            messageEl.style.color = '#64748b';
            messageEl.textContent = 'กำลังสมัครสมาชิก...';

            try {
                const response = await fetch('src/api/signup.php', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    messageEl.style.color = '#166534';
                    messageEl.textContent = result.message;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    messageEl.style.color = '#dc2626';
                    messageEl.textContent = result.message;
                }
            } catch (error) {
                messageEl.style.color = '#dc2626';
                messageEl.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                console.error('Error:', error);
            }
        });

        setupPasswordToggle('password', 'togglePassword');
        setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');
    </script>
</body>

</html>
